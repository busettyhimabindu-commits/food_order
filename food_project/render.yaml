services:
  # FastAPI Backend Web Service
  - type: web
    name: hima-food-ai-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        value: localhost
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: root
      - key: DB_PASSWORD
        value: tiger
      - key: DB_NAME
        value: food_datase
      - key: JWT_SECRET
        value: hima_food_ai_super_secret_jwt_key_2026_secure
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "4320"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_TFITaPKV4DKgUq
      - key: RAZORPAY_KEY_SECRET
        value: qBC3PLyrVo8SAJ1K3tRdNaGk
      - key: AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: snivwqcw
      - key: CLOUDINARY_API_KEY
        value: "664379995118548"
      - key: CLOUDINARY_API_SECRET
        value: -2HdOT9pV6-H4U1rsB_Dna_wR-s
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
