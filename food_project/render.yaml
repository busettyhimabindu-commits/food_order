        value: busettyhimabindu@gmail.com
      - key: SMTP_FROM_NAME
        value: Food Connect AI
      - key: BREVO_API_KEY
        sync: false

  # React Vite Frontend Static Site
  - type: web
    name: hima-food-ai-frontend
    env: static
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
